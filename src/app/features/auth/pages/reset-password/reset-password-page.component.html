<main class="login-page">
  <section class="login-content">
    <article class="login-panel">
      <header class="brand">
        <object
          data="assets/service-logo-official.svg"
          type="image/svg+xml"
          aria-label="Logo Service"
        ></object>
      </header>

      <form class="login-form" [formGroup]="resetForm" (ngSubmit)="onSubmit()">
        <h1>Redefina sua senha</h1>
        <p>Informe o código recebido e cadastre uma nova senha para acessar sua conta.</p>

        <label for="code">Código de verificação</label>
        <div class="input-wrap token-wrap" [class.invalid]="isFieldInvalid('code')">
          <i class="bi bi-shield-check" aria-hidden="true"></i>
          <input
            id="code"
            type="text"
            placeholder="0000"
            formControlName="code"
            maxlength="4"
            autocomplete="one-time-code"
            inputmode="numeric"
          />
        </div>

        <label for="password">Nova senha</label>
        <div class="input-wrap" [class.invalid]="isFieldInvalid('password')">
          <i class="bi bi-lock" aria-hidden="true"></i>
          <input
            id="password"
            type="password"
            placeholder="Digite sua nova senha"
            formControlName="password"
            autocomplete="new-password"
          />
        </div>

        <label for="confirmPassword">Confirme a nova senha</label>
        <div class="input-wrap" [class.invalid]="isConfirmInvalid()">
          <i class="bi bi-lock" aria-hidden="true"></i>
          <input
            id="confirmPassword"
            type="password"
            placeholder="Digite novamente"
            formControlName="confirmPassword"
            autocomplete="new-password"
          />
        </div>

        <button type="submit" [disabled]="isSubmitting()">
          @if (isSubmitting()) {
            <span class="spinner-border spinner-border-sm me-2"></span>
            CONFIRMANDO
          } @else {
            CONFIRMAR
          }
        </button>

        <a class="back-link" routerLink="/auth/login" aria-label="Voltar para a tela de login">
          <i class="bi bi-arrow-left" aria-hidden="true"></i>
          Voltar para a tela de login
        </a>
      </form>
    </article>

    <figure class="illustration-panel">
      <img src="assets/login-illustration.svg" alt="Ilustração de pessoas e engrenagens" />
    </figure>
  </section>

  <footer class="login-footer">
    <a routerLink="/auth/terms-of-use"><strong>TERMOS DE USO</strong></a>
    <a routerLink="/auth/privacy-policy"><strong>POLÍTICA DE PRIVACIDADE</strong></a>
    <a routerLink="/auth/contact"><strong>CONTATO</strong></a>
  </footer>
</main>
