<main class="reset-password-page">
  <section class="reset-content">
    <article class="reset-panel">
      <header class="brand">
        <object
          data="assets/service-logo-official.svg"
          type="image/svg+xml"
          aria-label="Logo Service"
        ></object>
      </header>

      <h1>Esqueceu sua senha?</h1>
      <p class="description">
        Para cadastrar sua nova senha, informe o codigo que voce recebeu por email.
      </p>

      <form [formGroup]="resetForm" (ngSubmit)="onSubmit()">
        <label for="code">Codigo</label>
        <div class="input-wrap token-wrap" [class.invalid]="isFieldInvalid('code')">
          <input
            id="code"
            type="text"
            placeholder="0000"
            formControlName="code"
            maxlength="4"
            autocomplete="one-time-code"
          />
        </div>

        <label for="password">Nova senha</label>
        <div class="input-wrap" [class.invalid]="isFieldInvalid('password')">
          <i class="bi bi-lock" aria-hidden="true"></i>
          <input
            id="password"
            type="password"
            placeholder="*****"
            formControlName="password"
            autocomplete="new-password"
          />
        </div>

        <label for="confirmPassword">Confirme a nova senha</label>
        <div class="input-wrap" [class.invalid]="isConfirmInvalid()">
          <i class="bi bi-lock" aria-hidden="true"></i>
          <input
            id="confirmPassword"
            type="password"
            placeholder="*****"
            formControlName="confirmPassword"
            autocomplete="new-password"
          />
        </div>

        <button type="submit" [disabled]="isSubmitting()">
          @if (isSubmitting()) {
            <span class="spinner-border spinner-border-sm me-2"></span>
            CONFIRMANDO
          } @else {
            CONFIRMAR
          }
        </button>
      </form>

      <a class="back-link" routerLink="/auth/login" aria-label="Voltar para a tela de login">
        <i class="bi bi-arrow-left" aria-hidden="true"></i>
        Voltar para a tela de login
      </a>
    </article>

    <figure class="illustration-panel">
      <img src="assets/login-illustration.svg" alt="Ilustração de pessoas e engrenagens" />
    </figure>
  </section>

  <footer class="reset-footer">
    <a routerLink="/auth/terms-of-use"><strong>TERMOS DE USO</strong></a>
    <a routerLink="/auth/privacy-policy"><strong>POLITICAS DE PRIVACIDADE</strong></a>
    <a routerLink="/auth/contact"><strong>CONTATO</strong></a>
  </footer>
</main>
