<main class="login-page">
  <section class="login-content">
    <article class="login-panel">
      <header class="brand">
        <object
          data="/assets/service-logo-official.svg"
          type="image/svg+xml"
          aria-label="Logo Service"
        ></object>
      </header>

      <form class="login-form" [formGroup]="loginForm" (ngSubmit)="onSubmit()">
        <h1>Seja bem vindo(a)!</h1>
        <p>Acesse com suas credenciais reais para consumir o backend documentado.</p>

        <div class="status-chip" [class.up]="apiStatusState() === 'up'" [class.down]="apiStatusState() === 'down'">
          <i
            class="bi"
            [class.bi-check-circle-fill]="apiStatusState() === 'up'"
            [class.bi-exclamation-octagon-fill]="apiStatusState() === 'down'"
            [class.bi-arrow-repeat]="apiStatusState() === 'pending'"
            aria-hidden="true"
          ></i>
          <span>{{ apiStatusMessage() }}</span>
        </div>

        <label for="email">Email</label>
        <div class="input-wrap" [class.invalid]="isFieldInvalid('email')">
          <i class="bi bi-person" aria-hidden="true"></i>
          <input
            id="email"
            type="email"
            placeholder="mail@email.com"
            formControlName="email"
            autocomplete="email"
          />
        </div>

        <label for="password">Senha</label>
        <div class="input-wrap" [class.invalid]="isFieldInvalid('password')">
          <i class="bi bi-lock" aria-hidden="true"></i>
          <input
            id="password"
            type="password"
            placeholder="*****"
            formControlName="password"
            autocomplete="current-password"
          />
        </div>

        <a
          class="forgot-link"
          routerLink="/auth/forgot-password"
          aria-label="Esqueceu sua senha"
        >
          Esqueceu a senha? <b>Clique aqui!</b>
        </a>

        <button type="submit" [disabled]="isSubmitting() || !loginForm.valid">
          @if (isSubmitting()) {
            <span class="spinner-border spinner-border-sm me-2"></span>
            ENTRANDO
          } @else {
            ENTRAR
          }
        </button>
      </form>
    </article>

    <figure class="illustration-panel">
      <img src="/assets/login-illustration.svg" alt="Ilustracao de pessoas e engrenagens" />
    </figure>
  </section>

  <footer class="login-footer">
    <a routerLink="/auth/terms-of-use"><strong>TERMOS DE USO</strong></a>
    <a routerLink="/auth/privacy-policy"><strong>POLITICAS DE PRIVACIDADE</strong></a>
    <a routerLink="/auth/contact"><strong>CONTATO</strong></a>
  </footer>
</main>
