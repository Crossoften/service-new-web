<main class="forgot-password-page">
  <section class="forgot-password-container">
    <article class="forgot-password-panel">
      <header class="brand">
        <object
          data="/assets/service-logo-official.svg"
          type="image/svg+xml"
          aria-label="Logo Service"
        ></object>
      </header>

      <h1>Esqueceu sua senha?</h1>
      <p class="description">
        Digite seu e-mail para que possamos enviar um código de verificação:
      </p>

      <form class="forgot-password-form" [formGroup]="forgotPasswordForm" (ngSubmit)="onSubmit()">
        <label for="email">Email</label>
        <div class="input-wrap" [class.invalid]="isFieldInvalid('email')">
          <i class="bi bi-person" aria-hidden="true"></i>
          <input
            id="email"
            type="email"
            placeholder="mail@email.com"
            formControlName="email"
            autocomplete="email"
          />
        </div>

        <button type="submit" [disabled]="isSubmitting() || !forgotPasswordForm.valid">
          @if (isSubmitting()) {
            <span class="spinner-border spinner-border-sm me-2"></span>
            ENVIANDO
          } @else {
            CONTINUAR
          }
        </button>

        <p class="test-hint">
          <strong>Teste:</strong> Use <code>{{ testCredentials.email }}</code> e código <code>{{ testCredentials.code }}</code>
        </p>
      </form>
    </article>

    <figure class="illustration-panel">
      <img src="/assets/login-illustration.svg" alt="Ilustracao de pessoas e engrenagens" />
    </figure>
  </section>
</main>
