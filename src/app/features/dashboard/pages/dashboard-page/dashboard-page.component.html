<div class="app-shell">
  <app-sidebar></app-sidebar>

  <main class="main-content">
    <div class="page-wrapper">
      @if (isLoading()) {
        <app-loading-skeleton [variant]="'card'" [count]="3"></app-loading-skeleton>
      } @else if (hasError()) {
        <div class="error-state">
          <i class="bi bi-exclamation-triangle" aria-hidden="true"></i>
          <p>Não foi possível carregar os dados do dashboard. Verifique a conexão com a API.</p>
        </div>
      } @else {
        <section class="stats-grid" aria-label="Resumo do dashboard">
          @for (card of metricCards(); track card.label) {
            <article class="stat-card" [class.unavailable]="card.unavailable">
              <div class="stat-icon">
                <i [class]="'bi ' + card.icon" aria-hidden="true"></i>
              </div>
              <div class="stat-copy">
                <strong class="stat-value">{{ card.value }}</strong>
                <span class="stat-label">{{ card.label }}</span>
                @if (card.unavailable) {
                  <span class="stat-note">Indisponível</span>
                }
              </div>
            </article>
          }
        </section>

        <section class="chart-card" aria-label="Gráfico do dashboard">
          <div class="chart-header">
            <h2>Usuários</h2>
            <div class="chart-legend" aria-label="Legenda do gráfico">
              <span class="legend-item users">
                <i class="legend-dot" aria-hidden="true"></i>
                Usuários
              </span>
              <span class="legend-item services">
                <i class="legend-dot" aria-hidden="true"></i>
                Serviços
              </span>
            </div>
          </div>
          <div class="chart-wrap">
            <canvas #chartCanvas aria-label="Gráfico mensal de usuários e serviços"></canvas>
          </div>
        </section>
      }
    </div>
  </main>
</div>
