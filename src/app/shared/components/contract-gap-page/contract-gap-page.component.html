<div class="app-shell">
  <app-sidebar></app-sidebar>

  <main class="main-content">
    <div class="page-wrapper">
      <p class="breadcrumb-label">RECURSO INDISPONÍVEL</p>
      <h1 class="page-title">{{ title }}</h1>

      <section class="notice-card">
        <div class="notice-icon" aria-hidden="true">
          <i class="bi bi-exclamation-diamond"></i>
        </div>

        <div class="notice-content">
          <h2>Este recurso ainda não está disponível</h2>
          <p>
            A opção já aparece no portal, mas ainda não pode ser utilizada. Tente novamente mais
            tarde.
          </p>

          <a class="action-link" [routerLink]="actionRoute">
            {{ actionLabel }}
          </a>
        </div>
      </section>
    </div>
  </main>
</div>
